<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MAGR Enterprises</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap">
<style>
  /* Layout: one quiet screen. The MAGR mark, a hairline, then every brand in its own colors. */
  :root {
    --ink: #0a0a0b;          /* page ground, a touch warmer than pure black */
    --ink-raised: #141416;
    --silk: #ecebe7;         /* primary text, warm off-white */
    --mist: #85837d;         /* labels */
    --hair: #2a2a2c;         /* hairlines */
    --champagne: #c8b38a;    /* focus ring only */
    --body: "Jost", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--silk);
    font-family: var(--body);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background-image: radial-gradient(ellipse 70% 50% at 50% 34%, var(--ink-raised), var(--ink) 70%);
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(44px, 8vh, 88px);
    padding-block: clamp(56px, 10vh, 112px) 32px;
    text-align: center;
  }

  h1 { margin: 0; line-height: 0; }
  h1 img { width: clamp(220px, 34vw, 380px); height: auto; }
  .rule { width: 48px; height: 1px; background: var(--hair); border: 0; margin: 0; }

  nav ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(40px, 6vh, 64px) clamp(24px, 4vw, 56px);
    max-width: 1080px;
  }
  nav a {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
    width: 210px;
    text-decoration: none;
    color: var(--silk);
    outline: none;
    border-radius: 4px;
  }
  .mark {
    height: 100px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mark img {
    height: var(--h, 60px);
    width: auto;
    max-width: 100%;
    object-fit: contain;
    opacity: .92;
    transition: opacity .6s ease, transform .6s cubic-bezier(.2,.7,.2,1);
  }
  /* Logos drawn in black are shown white so they read on the black page */
  .mark img.keep-white { filter: brightness(0) invert(1); }
  .label {
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0.3em;
    margin-right: -0.3em;
    text-transform: uppercase;
    color: var(--mist);
    transition: color .6s ease;
  }
  nav a:hover .mark img, nav a:focus-visible .mark img {
    opacity: 1;
    transform: translateY(-4px) scale(1.03);
  }
  nav a:hover .label, nav a:focus-visible .label { color: var(--silk); }
  nav a:focus-visible { box-shadow: 0 0 0 1px var(--champagne); }

  footer {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    padding-block: 28px 32px;
    font-size: 0.66rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--mist);
  }
  footer span + span::before { content: "·"; margin-right: 14px; color: var(--hair); }

  /* Quiet entrance; everything is fully visible once it settles */
  @media (prefers-reduced-motion: no-preference) {
    h1, nav li { animation: rise 1.1s cubic-bezier(.2,.7,.2,1) backwards; }
    nav li:nth-child(1) { animation-delay: .20s }
    nav li:nth-child(2) { animation-delay: .27s }
    nav li:nth-child(3) { animation-delay: .34s }
    nav li:nth-child(4) { animation-delay: .41s }
    nav li:nth-child(5) { animation-delay: .48s }
    nav li:nth-child(6) { animation-delay: .55s }
    nav li:nth-child(7) { animation-delay: .62s }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  }
  @media (prefers-reduced-motion: reduce) { .mark img, .label { transition: none; } }

  @media (max-width: 520px) {
    nav ul { gap: 44px 16px; }
    nav a { width: calc(50vw - 32px); max-width: 170px; gap: 18px; }
    .mark { height: 80px; }
    .mark img { height: calc(var(--h, 60px) * .8); }
    .label { font-size: 0.6rem; letter-spacing: 0.22em; margin-right: -0.22em; }
  }
</style>

<main>
  <h1><img src="img/magr-enterprises.png" alt="MAGR Enterprises" width="1128" height="299"></h1>

  <hr class="rule">

  <nav aria-label="MAGR brands">
    <ul>
      <li>
        <a href="https://magrmedia.com/mediadivision/" target="_blank" rel="noopener">
          <span class="mark"><img src="img/media-division.png" alt="" style="--h:62px"></span>
          <span class="label">Media Division</span>
        </a>
      </li>
      <li>
        <a href="https://magrmedia.com/triple-m/" target="_blank" rel="noopener">
          <span class="mark"><img src="img/triple-m.png" alt="" style="--h:58px"></span>
          <span class="label">Musical Movies</span>
        </a>
      </li>
      <li>
        <a href="https://magrmedia.com/thepodcasthouse/" target="_blank" rel="noopener">
          <span class="mark"><img src="img/podcast-house.png" alt="" style="--h:40px"></span>
          <span class="label">Podcast House</span>
        </a>
      </li>
      <li>
        <a href="https://magrmedia.com/the-magr-network/" target="_blank" rel="noopener">
          <span class="mark"><img src="img/magr-network.png" class="keep-white" alt="" style="--h:21px"></span>
          <span class="label">The Network</span>
        </a>
      </li>
      <li>
        <a href="https://wakeuplehighvalley.com/" target="_blank" rel="noopener">
          <span class="mark"><img src="img/wulv-color.svg" alt="" style="--h:84px"></span>
          <span class="label">Wake Up LV</span>
        </a>
      </li>
      <li>
        <a href="https://goodboykennels.com/" target="_blank" rel="noopener">
          <span class="mark"><img src="img/gbk.png" alt="" style="--h:76px"></span>
          <span class="label">Good Boy Kennels</span>
        </a>
      </li>
      <li>
        <a href="https://magrmedia.com/shop/" target="_blank" rel="noopener">
          <span class="mark"><img src="img/merch.png" alt="" style="--h:92px"></span>
          <span class="label">Merch</span>
        </a>
      </li>
    </ul>
  </nav>
</main>

<footer>
  <span>Bethlehem, PA</span>
  <span>© 2026 MAGR Enterprises</span>
</footer>

</body></html>
